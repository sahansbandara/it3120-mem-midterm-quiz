    let userAnswers = {};
    let correctCount = 0;
    let answeredCount = 0;

    function renderQuestions(filter = 'all') {
      const wrapper = document.getElementById('questions-wrapper');
      wrapper.innerHTML = '';

      questionsData.forEach(q => {
        if (filter !== 'all' && q.lecture !== parseInt(filter)) return;

        const isMaq = q.type === 'maq';
        const card = document.createElement('div');
        card.className = 'question-card';
        card.id = `q-card-${q.id}`;

        let optionsHtml = '';
        q.options.forEach((opt, idx) => {
          const inputType = isMaq ? 'checkbox' : 'radio';
          optionsHtml += `
            <label class="option-item" id="opt-label-${q.id}-${idx}">
              <input type="${inputType}" name="q-${q.id}" value="${idx}" onchange="handleOptionChange(${q.id})">
              <span>${opt}</span>
            </label>
          `;
        });

        card.innerHTML = `
          <div class="q-header">
            <span class="q-badge ${isMaq ? 'badge-maq' : 'badge-mcq'}">${isMaq ? 'Multiple-Answer (MAQ)' : 'Single-Choice (MCQ)'}</span>
            <span class="q-num">Q${q.id} (Lecture ${q.lecture})</span>
          </div>
          <div class="q-text">${q.question}</div>
          <div class="options-list">
            ${optionsHtml}
          </div>
          <div class="card-actions">
            <button class="btn btn-primary" onclick="checkAnswer(${q.id})">Submit Answer</button>
            <button class="btn btn-secondary" onclick="resetQuestion(${q.id})">Reset</button>
          </div>
          <div class="feedback-box" id="feedback-${q.id}"></div>
        `;

        wrapper.appendChild(card);
      });
    }

    function handleOptionChange(qId) {
      const q = questionsData.find(item => item.id === qId);
      if (q.type === 'mcq') {
        checkAnswer(qId);
      }
    }

    function checkAnswer(qId) {
      const q = questionsData.find(item => item.id === qId);
      const inputs = document.querySelectorAll(`input[name="q-${qId}"]:checked`);
      const selected = Array.from(inputs).map(i => parseInt(i.value));

      if (selected.length === 0) return;

      const feedbackBox = document.getElementById(`feedback-${qId}`);
      const isCorrect = arraysEqual(selected.sort(), q.answer.sort());

      // Highlight options
      q.options.forEach((_, idx) => {
        const label = document.getElementById(`opt-label-${qId}-${idx}`);
        label.classList.remove('correct', 'wrong');

        if (q.answer.includes(idx)) {
          label.classList.add('correct');
        } else if (selected.includes(idx)) {
          label.classList.add('wrong');
        }
      });

      // Show feedback
      feedbackBox.style.display = 'block';
      if (isCorrect) {
        feedbackBox.className = 'feedback-box feedback-correct';
        feedbackBox.innerHTML = `<strong>Correct!</strong><div class="rationale">${q.rationale}</div>`;
      } else {
        feedbackBox.className = 'feedback-box feedback-wrong';
        feedbackBox.innerHTML = `<strong>Incorrect.</strong><div class="rationale">${q.rationale}</div>`;
      }

      // Track score
      if (!userAnswers[qId]) {
        answeredCount++;
        if (isCorrect) correctCount++;
        userAnswers[qId] = isCorrect;
      } else {
        if (userAnswers[qId] !== isCorrect) {
          if (isCorrect) correctCount++;
          else correctCount--;
          userAnswers[qId] = isCorrect;
        }
      }

      updateStats();
    }

    function resetQuestion(qId) {
      const inputs = document.querySelectorAll(`input[name="q-${qId}"]`);
      inputs.forEach(i => i.checked = false);

      const q = questionsData.find(item => item.id === qId);
      q.options.forEach((_, idx) => {
        const label = document.getElementById(`opt-label-${qId}-${idx}`);
        label.classList.remove('correct', 'wrong');
      });

      const feedbackBox = document.getElementById(`feedback-${qId}`);
      feedbackBox.style.display = 'none';

      if (userAnswers[qId] !== undefined) {
        if (userAnswers[qId]) correctCount--;
        answeredCount--;
        delete userAnswers[qId];
        updateStats();
      }
    }

    function updateStats() {
      document.getElementById('answered-count').textContent = answeredCount;
      document.getElementById('correct-count').textContent = correctCount;
      const pct = answeredCount === 0 ? 0 : Math.round((correctCount / answeredCount) * 100);
      document.getElementById('score-percentage').textContent = pct + '%';
    }

    function arraysEqual(a, b) {
      if (a.length !== b.length) return false;
      for (let i = 0; i < a.length; i++) {
        if (a[i] !== b[i]) return false;
      }
      return true;
    }

    function filterLecture(lec, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderQuestions(lec);
    }

    // Initial render
    renderQuestions('all');
  </script>

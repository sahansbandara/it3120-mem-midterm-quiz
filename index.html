<script>
const BANK=[{"lecture": "Lecture 01 - Introduction to Management Concepts", "lectureNo": 1, "sourceQ": 1, "type": "Single Choice", "question": "Which approach focuses on employee needs and motivation?", "options": {"A": "Classical", "B": "Behavioral", "C": "Quantitative", "D": "Modern"}, "correct": ["B"], "hint": "Which management approach is centered most directly on people, satisfaction, relationships, and motivation?", "explanation": "The Behavioral approach focuses on employees, motivation, emotions, relationships, satisfaction, and performance.", "wrong": ["A. Classical focuses on structure, rules, efficiency, and control.", "C. Quantitative emphasizes mathematical and statistical methods.", "D. Modern approaches emphasize flexibility, systems thinking, and contingency."], "trap": "Do not choose Modern just because it includes people; **employee needs and motivation** specifically point to Behavioral."}, {"lecture": "Lecture 01 - Introduction to Management Concepts", "lectureNo": 1, "sourceQ": 2, "type": "Single Choice", "question": "Which is an example of intrinsic motivation?", "options": {"A": "Working for a bonus", "B": "Working to avoid punishment", "C": "Working because you enjoy the task", "D": "Working for promotion"}, "correct": ["C"], "hint": "Ask whether the motivation comes from the activity itself or from an outside reward/consequence.", "explanation": "Intrinsic motivation comes from enjoyment, interest, learning, or personal growth within the task itself.", "wrong": ["A. A bonus is an external reward.", "B. Avoiding punishment is an external consequence.", "D. Promotion is an external reward."], "trap": "**Intrinsic = inside the task; Extrinsic = outside reward or consequence.**"}, {"lecture": "Lecture 01 - Introduction to Management Concepts", "lectureNo": 1, "sourceQ": 3, "type": "Single Choice", "question": "According to Mary Parker Follett, management is:", "options": {"A": "The process of planning, organizing, leading, and controlling", "B": "The art of getting things done through people", "C": "The use of statistics for decisions", "D": "Supervising daily operations"}, "correct": ["B"], "hint": "Which definition emphasizes **people** rather than the four management functions?", "explanation": "Mary Parker Follett defined management as **the art of getting things done through people** and described management as a philosophy.", "wrong": ["A. This is the management-process definition associated with Fayol in the lecture.", "C. This describes the Quantitative approach.", "D. This is closer to first-line operational supervision."], "trap": "**Fayol = Functions; Follett = through people.**"}, {"lecture": "Lecture 01 - Introduction to Management Concepts", "lectureNo": 1, "sourceQ": 4, "type": "Single Choice", "question": "A manager compares actual results with expected results and takes corrective action. This is:", "options": {"A": "Planning", "B": "Organizing", "C": "Leading", "D": "Controlling"}, "correct": ["D"], "hint": "Which POLC function checks performance against plans and fixes deviations?", "explanation": "Controlling means monitoring performance, comparing actual outcomes with expected results, and taking corrective action when needed.", "wrong": ["A. Planning sets goals and decides future actions.", "B. Organizing arranges tasks, resources, authority, and coordination.", "C. Leading guides and motivates people."], "trap": "**Compare + correct = Controlling.**"}, {"lecture": "Lecture 01 - Introduction to Management Concepts", "lectureNo": 1, "sourceQ": 5, "type": "Single Choice", "question": "Assigning authority and responsibility is mainly part of:", "options": {"A": "Planning", "B": "Organizing", "C": "Leading", "D": "Controlling"}, "correct": ["B"], "hint": "Which function decides structure and who is responsible for what?", "explanation": "Organizing includes deciding structure, assigning authority and responsibility, acquiring resources, and coordinating activities.", "wrong": ["A. Planning defines goals and future courses of action.", "C. Leading guides and motivates employees within the structure.", "D. Controlling checks performance against objectives."], "trap": "Assigning authority = **Organizing**; inspiring people = **Leading**."}, {"lecture": "Lecture 01 - Introduction to Management Concepts", "lectureNo": 1, "sourceQ": 6, "type": "Single Choice", "question": "A senior developer's advice is followed because colleagues trust her technical competence. This is:", "options": {"A": "Legitimate power", "B": "Expert power", "C": "Information power", "D": "Referent power"}, "correct": ["B"], "hint": "Is the influence coming from formal position, access to information, personal attraction, or technical competence?", "explanation": "Expert power comes from specialized knowledge, skills, and competence that others trust.", "wrong": ["A. Legitimate power comes from formal position or authority.", "C. Information power comes from access to or control of important information.", "D. Referent power comes from admiration, identification, or personal appeal."], "trap": "**Expert = what you know; Information = what you can access/control.**"}, {"lecture": "Lecture 01 - Introduction to Management Concepts", "lectureNo": 1, "sourceQ": 7, "type": "Single Choice", "question": "Which power creates compliance through fear?", "options": {"A": "Reward", "B": "Corrective", "C": "Connection", "D": "Legitimate"}, "correct": ["B"], "hint": "Which type of power is based on punishment or discipline?", "explanation": "Corrective power is the ability to punish or discipline, such as issuing warnings or demotions.", "wrong": ["A. Reward power gives desirable benefits.", "C. Connection power comes from useful relationships or networks.", "D. Legitimate power comes from recognized formal authority."], "trap": "The lecture uses **Corrective**; do not replace it with a different textbook term."}, {"lecture": "Lecture 01 - Introduction to Management Concepts", "lectureNo": 1, "sourceQ": 8, "type": "Single Choice", "question": "Employees report to more than one manager in a:", "options": {"A": "Functional structure", "B": "Divisional structure", "C": "Matrix structure", "D": "Flat structure"}, "correct": ["C"], "hint": "Which structure combines two reporting dimensions?", "explanation": "A Matrix structure combines functional and divisional dimensions, so employees may report to more than one manager.", "wrong": ["A. Functional structure groups employees by specialized function.", "B. Divisional structure groups by product, service, or region.", "D. Flat structure reduces management layers but does not inherently create dual reporting."], "trap": "**Matrix = dual reporting.**"}, {"lecture": "Lecture 01 - Introduction to Management Concepts", "lectureNo": 1, "sourceQ": 9, "type": "Single Choice", "question": "The correct bottom-to-top order of Maslow's hierarchy is:", "options": {"A": "Physiological → Safety → Social → Esteem → Self-actualization", "B": "Safety → Physiological → Esteem → Social → Self-actualization", "C": "Physiological → Social → Safety → Self-actualization → Esteem", "D": "Self-actualization → Esteem → Social → Safety → Physiological"}, "correct": ["A"], "hint": "Start with basic survival needs and move upward to personal fulfillment.", "explanation": "Maslow's hierarchy progresses from **Physiological → Safety → Social → Esteem → Self-actualization**.", "wrong": ["B. This swaps Physiological and Safety.", "C. This misorders Safety, Social, Esteem, and Self-actualization.", "D. This gives the hierarchy in reverse order."], "trap": "Read the direction: **bottom-to-top** matters."}, {"lecture": "Lecture 01 - Introduction to Management Concepts", "lectureNo": 1, "sourceQ": 10, "type": "Single Choice", "question": "In Herzberg's theory, salary is classified as:", "options": {"A": "A motivator", "B": "A hygiene factor", "C": "Both", "D": "Neither"}, "correct": ["B"], "hint": "Which factors prevent dissatisfaction rather than create deep satisfaction?", "explanation": "Herzberg classifies salary as a **hygiene factor**. Hygiene factors reduce dissatisfaction but are not the main source of strong motivation.", "wrong": ["A. Motivators include achievement, recognition, responsibility, growth, and meaningful work.", "C. The theory separates hygiene factors and motivators.", "D. Salary is explicitly included among hygiene factors."], "trap": "Salary can reduce dissatisfaction without being a true **motivator** in Herzberg's model."}, {"lecture": "Lecture 01 - Introduction to Management Concepts", "lectureNo": 1, "sourceQ": 11, "type": "Single Choice", "question": "The stated disadvantage of vertical management is:", "options": {"A": "It costs too much", "B": "It limits information flow from lower levels to upper levels", "C": "It removes supervision", "D": "It duplicates resources"}, "correct": ["B"], "hint": "Think about what happens to communication when authority passes through many hierarchical levels.", "explanation": "Vertical management is highly structured, and a stated limitation is restricted information flow from lower levels to upper levels.", "wrong": ["A. This is not the stated disadvantage.", "C. Vertical structures generally involve more supervision, not less.", "D. Duplication of resources is associated with divisional structures."], "trap": "Do not mix disadvantages from different organizational structures."}, {"lecture": "Lecture 01 - Introduction to Management Concepts", "lectureNo": 1, "sourceQ": 12, "type": "Single Choice", "question": "\"There is no single best way to manage\" describes:", "options": {"A": "Systems perspective", "B": "Scientific Management", "C": "Contingency perspective", "D": "Symbolic perspective"}, "correct": ["C"], "hint": "Which approach says the suitable method depends on the situation?", "explanation": "The Contingency perspective argues that the best management approach depends on the work, environment, situation, and people involved.", "wrong": ["A. Systems thinking focuses on interrelated organizational parts.", "B. Scientific Management searches for efficient methods and standardized work.", "D. Symbolic perspectives focus on meaning, stories, and symbols."], "trap": "Contingency means **fit the approach to conditions**, not manage randomly."}, {"lecture": "Lecture 01 - Introduction to Management Concepts", "lectureNo": 1, "sourceQ": 13, "type": "Single Choice", "question": "A firm groups employees into Marketing, Finance and IT departments. This is a:", "options": {"A": "Divisional structure", "B": "Functional structure", "C": "Matrix structure", "D": "Decentralized structure"}, "correct": ["B"], "hint": "Look at the **basis of grouping**: are employees grouped by function, product, region, or multiple dimensions?", "explanation": "A Functional structure groups employees according to specialized functions such as Marketing, Finance, and IT.", "wrong": ["A. Divisional structures group by product, service, or region.", "C. Matrix structures combine reporting dimensions and commonly involve dual reporting.", "D. Decentralization describes where decision authority is located, not the department-grouping basis."], "trap": "**Function names → Functional structure. Product/region → Divisional structure.**"}, {"lecture": "Lecture 01 - Introduction to Management Concepts", "lectureNo": 1, "sourceQ": 14, "type": "Multiple Answer", "question": "Which are Herzberg **motivators**? (Select all that apply.)", "options": {"A": "Achievement", "B": "Recognition", "C": "Job security", "D": "Responsibility", "E": "Working conditions"}, "correct": ["A", "B", "D"], "hint": "Choose factors that create satisfaction through the work itself rather than merely preventing dissatisfaction.", "explanation": "Herzberg motivators include **achievement, recognition, responsibility, growth, and meaningful work**.", "wrong": ["C. Job security is a hygiene factor.", "E. Working conditions are a hygiene factor."], "trap": "⚠ **Over-selection warning:** positive-sounding factors are not automatically motivators."}, {"lecture": "Lecture 01 - Introduction to Management Concepts", "lectureNo": 1, "sourceQ": 15, "type": "Multiple Answer", "question": "Which are types of power named in the lecture? (Select all that apply.)", "options": {"A": "Legitimate", "B": "Referent", "C": "Connection", "D": "Corrective", "E": "Charismatic"}, "correct": ["A", "B", "C", "D"], "hint": "Recall the lecture's named power categories, not general leadership adjectives.", "explanation": "The lecture names power types including **Legitimate, Reward, Corrective, Expert, Referent, Information, and Connection**.", "wrong": ["E. Charismatic is not listed as a separate power type; charisma may contribute to Referent power."], "trap": "⚠ **Over-selection warning:** a source of influence is not necessarily a named power category."}, {"lecture": "Lecture 01 - Introduction to Management Concepts", "lectureNo": 1, "sourceQ": 16, "type": "Multiple Answer", "question": "Which describe the four management functions correctly? (Select all that apply.)", "options": {"A": "Planning sets goals and decides courses of action", "B": "Organizing arranges tasks, resources and authority", "C": "Leading guides and motivates people", "D": "Controlling compares results and corrects deviations", "E": "The functions occur in a strict sequence that ends after controlling"}, "correct": ["A", "B", "C", "D"], "hint": "Remember that POLC describes four functions, but the lecture says management processes are ongoing and interrelated.", "explanation": "Planning sets goals, Organizing arranges resources and authority, Leading guides and motivates people, and Controlling compares results and corrects deviations.", "wrong": ["E. The lecture says the functions are ongoing, interrelated, and not necessarily performed in a strict linear sequence."], "trap": "⚠ **Over-selection warning:** the POLC order is useful for learning, but real management is not strictly linear."}, {"lecture": "Lecture 01 - Introduction to Management Concepts", "lectureNo": 1, "sourceQ": 17, "type": "Multiple Answer", "question": "Which statements describe **Planning** according to the lecture? (Select all that apply.)", "options": {"A": "Defines organizational goals", "B": "Develops strategic plans", "C": "Creates tactical plans that translate strategy into specific actions", "D": "Measures actual results against expected results", "E": "Bridges the gap between where the organization is and where it wants to be"}, "correct": ["A", "B", "C", "E"], "hint": "Choose future-oriented activities involving goals, strategy, and actions.", "explanation": "Planning defines goals, develops long-term strategic plans, creates tactical plans for specific actions, and bridges the gap between the organization's current and desired future position.", "wrong": ["D. Measuring actual against expected results belongs to Controlling."], "trap": "⚠ **Over-selection warning:** Planning creates the standard; Controlling later compares performance against it."}, {"lecture": "Lecture 01 - Introduction to Management Concepts", "lectureNo": 1, "sourceQ": 18, "type": "Multiple Answer", "question": "Which statements correctly describe **Organizing**? (Select all that apply.)", "options": {"A": "Decides how plans will be implemented", "B": "Assigns authority and responsibility", "C": "Acquires resources", "D": "Decides coordination", "E": "Determines employee motivation only through rewards and punishments"}, "correct": ["A", "B", "C", "D"], "hint": "Think structure, resources, responsibility, and coordination.", "explanation": "Organizing determines how plans are implemented, how the organization is structured, who has authority and responsibility, what resources are needed, and how work is coordinated.", "wrong": ["E. Motivation and use of rewards/punishments are associated more directly with Leading in the lecture."], "trap": "⚠ **Over-selection warning:** do not mix **structuring work** with **motivating people**."}, {"lecture": "Lecture 01 - Introduction to Management Concepts", "lectureNo": 1, "sourceQ": 19, "type": "Multiple Answer", "question": "Which are characteristics of **Leading** in the lecture? (Select all that apply.)", "options": {"A": "Communicating with employees", "B": "Building commitment", "C": "Creating shared values", "D": "Encouraging high performance", "E": "Preparing the Balance Sheet"}, "correct": ["A", "B", "C", "D"], "hint": "Leading is about influencing people toward organizational goals.", "explanation": "The lecture describes Leading as inspiring achievement through communication, commitment, shared values, and encouragement of high performance.", "wrong": ["E. Preparing a Balance Sheet is an accounting activity, not a Leading function."], "trap": "⚠ **Over-selection warning:** select only people-influence activities."}, {"lecture": "Lecture 01 - Introduction to Management Concepts", "lectureNo": 1, "sourceQ": 20, "type": "Multiple Answer", "question": "Which statements about management processes are correct? (Select all that apply.)", "options": {"A": "They are ongoing activities", "B": "They are interrelated", "C": "Results of one management task can influence another", "D": "They must always be completed in a strict step-by-step order", "E": "Multiple management functions can occur at the same time"}, "correct": ["A", "B", "C", "E"], "hint": "Recall the lecture's warning that management processes do not always happen in neat sequence.", "explanation": "Management processes are **ongoing and interrelated**. Activities can overlap, and results from one task can influence others.", "wrong": ["D. The lecture explicitly states that management activities are not always done in a strict linear, step-by-step order."], "trap": "⚠ **Over-selection warning:** the diagram may look sequential, but the process is **continuous and overlapping**."}, {"lecture": "Lecture 02 - Introduction to Marketing", "lectureNo": 2, "sourceQ": 1, "type": "Single Choice", "question": "What should be the first step before launching a product?", "options": {"A": "Advertising campaign", "B": "Market research", "C": "Pricing strategy", "D": "Product launch"}, "correct": ["B"], "hint": "Before deciding price, promotion, or launch, what should the company learn about customers first?", "explanation": "Market research identifies customer needs, preferences, and behaviour and reduces uncertainty before marketing decisions are made.", "wrong": ["A. Advertising depends on information gathered from research.", "C. Pricing decisions should be informed by market and customer research.", "D. Product launch is the outcome, not the first step."], "trap": "Research comes before the execution decisions."}, {"lecture": "Lecture 02 - Introduction to Marketing", "lectureNo": 2, "sourceQ": 2, "type": "Single Choice", "question": "Which strategy focuses on **selecting** the right customer group?", "options": {"A": "Positioning", "B": "Segmentation", "C": "Targeting", "D": "Branding"}, "correct": ["C"], "hint": "Remember the STP verbs: divide → select → shape perception.", "explanation": "Segmentation divides the market, Targeting selects the most attractive segment, and Positioning creates a desired image in that segment's mind.", "wrong": ["A. Positioning shapes perception after the target is chosen.", "B. Segmentation creates groups but does not select one.", "D. Branding is not one of the three STP stages."], "trap": "**Segmentation = divide; Targeting = select; Positioning = perception.**"}, {"lecture": "Lecture 02 - Introduction to Marketing", "lectureNo": 2, "sourceQ": 3, "type": "Single Choice", "question": "What is the main goal of CRM?", "options": {"A": "Increase production", "B": "Reduce employees", "C": "Build long-term customer relationships", "D": "Focus only on new customers"}, "correct": ["C"], "hint": "CRM is mainly about managing interactions so customers continue their relationship with the business.", "expla urve at:", "options": {"A": "The maximum of ATC", "B": "The minimum of ATC", "C": "The minimum of AFC", "D": "Where AVC = AFC"}, "correct": ["B"], "hint": "When MC is below an average it pulls the average down; when above it, it pulls the average up.", "explanation": "MC crosses ATC at the **minimum point of ATC**.", "wrong": ["A. The crossing is at the minimum, not maximum.", "C. AFC keeps falling as output rises.", "D. The crossing is not defined by AVC = AFC."], "trap": "Remember the **bottom of the U-shaped ATC curve**."}, {"lecture": "Lecture 03 - Introduction to Economics", "lectureNo": 3, "sourceQ": 7, "type": "Single Choice", "question": "Which pair correctly matches elasticity examples from the lecture?", "options": {"A": "Elastic — insulin; Inelastic — handbags", "B": "Elastic — luxury handbags; Inelastic — insulin and gasoline", "C": "Both elastic", "D": "Elastic — gasoline; Inelastic — vacations"}, "correct": ["B"], "hint": "Necessities with few substitutes respond less strongly to price changes than luxuries.", "explanation": "Luxury goods with alternatives tend to be elastic, while necessities such as insulin and gasoline are relatively inelastic.", "wrong": ["A. The examples are reversed.", "C. The lecture contrasts elastic and inelastic goods.", "D. Gasoline is not the elastic example given."], "trap": "**Luxury → elastic; necessity → inelastic.**"}, {"lecture": "Lecture 03 - Introduction to Economics", "lectureNo": 3, "sourceQ": 8, "type": "Single Choice", "question": "In the circular flow model, households supply land, labour and capital through:", "options": {"A": "Product markets", "B": "Factor markets", "C": "Financial markets", "D": "Government markets"}, "correct": ["B"], "hint": "Land, labour, and capital are productive **inputs**.", "explanation": "Households supply land, labour, and capital through **factor markets**.", "wrong": ["A. Product markets contain produced goods and services.", "C. Financial markets are not part of the basic two-market model shown.", "D. Government markets are not part of that basic model."], "trap": "**Factor = inputs. Product = outputs.**"}, {"lecture": "Lecture 03 - Introduction to Economics", "lectureNo": 3, "sourceQ": 9, "type": "Single Choice", "question": "Which is NOT an assumption of perfect competition in the lecture?", "options": {"A": "Numerous buyers and sellers", "B": "Identical products", "C": "No barriers to entry or exit", "D": "One large firm sets the price"}, "correct": ["D"], "hint": "Can any one firm control price under perfect competition?", "explanation": "Perfect competition assumes numerous buyers and sellers, identical products, and no barriers to entry or exit.", "wrong": ["A. This is an assumption.", "B. This is an assumption.", "C. This is an assumption."], "trap": "Remember all three: **many participants + identical products + no barriers**."}, {"lecture": "Lecture 03 - Introduction to Economics", "lectureNo": 3, "sourceQ": 10, "type": "Single Choice", "question": "Consumer surplus is calculated as:", "options": {"A": "Price Received − Cost of Production", "B": "Willingness to Pay − Actual Price", "C": "Actual Price − Willingness to Pay", "D": "Total Cost / Quantity"}, "correct": ["B"], "hint": "How much extra value did the buyer receive compared with what they actually paid?", "explanation": "**Consumer Surplus = Willingness to Pay − Actual Price.**", "wrong": ["A. This is producer surplus.", "C. This reverses the subtraction.", "D. This is average total cost."], "trap": "Consumer: **WTP − Price**. Producer: **Price − Cost**."}, {"lecture": "Lecture 03 - Introduction to Economics", "lectureNo": 3, "sourceQ": 11, "type": "Single Choice", "question": "A firm has total fixed costs of $3,000 and total variable costs of $5,000 while producing 400 units. Cost per unit is:", "options": {"A": "$7.50", "B": "$12.50", "C": "$20.00", "D": "$2.00"}, "correct": ["C"], "hint": "Combine fixed and variable costs before dividing by units.", "explanation": "Cost enue"}, "correct": ["B"], "hint": "Not every amount of money spent is a recurring operating expense.", "explanation": "The lecture distinguishes **expenses** from broader **expenditure**. Buying equipment is spending, but it is treated as an investment rather than a daily recurring expense.", "wrong": ["A. Recurring expenses include salaries, rent, utilities, and supplies.", "C. Equipment is an asset, not an obligation owed.", "D. Revenue is money earned from sales."], "trap": "**Expenses are a subset of expenditure.**"}, {"lecture": "Lecture 05 - Introduction to Finance Accounting", "lectureNo": 5, "sourceQ": 4, "type": "Single Choice", "question": "A patent is classified as:", "options": {"A": "Current asset", "B": "Fixed asset", "C": "Intangible asset", "D": "Long-term liability"}, "correct": ["C"], "hint": "Ask whether a patent has physical form.", "explanation": "Patents are **intangible assets** because they provide non-physical value.", "wrong": ["A. Current assets are convertible to cash within one year.", "B. Fixed assets are long-term physical resources such as machinery or buildings.", "D. A liability is an obligation owed to an outside party."], "trap": "Long-term **physical** → fixed asset. Long-term **non-physical** → intangible asset."}, {"lecture": "Lecture 05 - Introduction to Finance Accounting", "lectureNo": 5, "sourceQ": 5, "type": "Single Choice", "question": "A mortgage payable is:", "options": {"A": "Current liability", "B": "Long-term liability", "C": "Current asset", "D": "Equity"}, "correct": ["B"], "hint": "Use the lecture’s **1-year rule**.", "explanation": "Mortgages are listed as **long-term liabilities**, meaning they are due beyond one year.", "wrong": ["A. Current liabilities are due within one year.", "C. A mortgage payable is owed, not owned.", "D. Equity is the owners’ residual stake."], "trap": "The **1-year line** separates current from long-term items."}, {"lecture": "Lecture 05 - Introduction to Finance Accounting", "lectureNo fitability.", "D. This is related more closely to efficiency/activity measures."], "trap": "**Gearing = long-term financing risk; Liquidity = short-term paying ability.**"}, {"lecture": "Lecture 05 - Introduction to Finance Accounting", "lectureNo": 5, "sourceQ": 9, "type": "Single Choice", "question": "Which does NOT belong in Operating Activities?", "options": {"A": "Cash received from customers", "B": "Salaries paid to employees", "C": "Purchase of a server", "D": "Payment to cloud service supplier"}, "correct": ["C"], "hint": "Is the item a day-to-day cash flow or the purchase of a long-term asset?", "explanation": "Purchasing a server is an **Investing Activity** because the server is a long-term asset.", "wrong": ["A. Customer receipts are Operating inflows.", "B. Salaries are Operating outflows.", "D. Cloud service payments are day-to-day Operating outflows."], "trap": "Buying a server = **Investing**; paying a recurring cloud subscription = **Operating**."}, {"lecture": "Lecture 05 - Introduction to Finance Accounting", "lectureNo": 5, "sourceQ": 10, "type": "Single Choice", "question": "A company reports profit but cannot pay its bills. This shows:", "options": {"A": "Profit and cash are the same", "B": "A profitable company can still fail without available cash", "C": "The Balance Sheet is wrong", "D": "Revenue was miscalculated"}, "correct": ["B"], "hint": "Accounting profit does not automatically mean cash is available right now.", "explanation": "The lecture states that a business can be profitable on paper but still face failure if it lacks available cash to meet obligations.", "wrong": ["A. Profit and cash are not the same.", "C. A cash shortage does not automatically mean the Balance Sheet is wrong.", "D. A cash shortage does not prove revenue was miscalculated."], "trap": "**Profitability ≠ liquidity.**"}, {"lecture": "Lecture 05 - Introduction to Finance Accounting", "lectureNo": 5, "sourceQ": 11, "type": "Single Choice", "question": "Revenue LKR 100,000; Cost of Sales LKR 60,000; Operating Expenses LKR 20,000. Gross Profit is:", "options": {"A": "20,000", "B": "40,000", "C": "60,000", "D": "80,000"}, "correct": ["B"], "hint": "Gross Profit subtracts **Cost of Sales**, not Operating Expenses.", "explanation": "Gross Profit = Revenue − Cost of Sales  \n= 100,000 − 60,000  \n= **LKR 40,000**", "wrong": ["A. This is operating profit after deducting operating expenses.", "C. This is the Cost of Sales figure.", "D. This subtracts only Operating Expenses from Revenue."], "trap": "Operating Expenses are deducted **after** Gross Profit."}, {"lecture": "Lecture 05 - Introduction to Finance Accounting", "lectureNo": 5, "sourceQ": 12, "type": "Single Choice", "question": "Same company: Assets LKR 150,000; Liabilities LKR 90,000. Equity is:", "options": {"A": "60,000", "B": "90,000", "C": "150,000", "D": "240,000"}, "correct": ["A"], "hint": "Use **Equity = Assets − Liabilities**.", "explanation": "Equity = 150,000 − 90,000 = **LKR 60,000**", "wrong": ["B. Repeats the liabilities figure.", "C. Repeats the assets figure.", "D. Incorrectly adds assets and liabilities."], "trap": "From **Assets = Liabilities + Equity**, subtract liabilities to isolate equity."}, {"lecture": "Lecture 05 - Introduction to Finance Accounting", "lectureNo": 5, "sourceQ": 13, "type": "Single Choice", "question": "Assets 85,000 and equity is (10,000). Liabilities are:", "options": {"A": "75,000", "B": "95,000", "C": "85,000", "D": "10,000"}, "correct": ["B"], "hint": "Parentheses indicate a negative value.", "explanation": "Liabilities = Assets − Equity  \n= 85,000 − (−10,000)  \n= **95,000**", "wrong": ["A. Ignores the negative sign.", "C. Repeats the assets figure.", "D. Repeats the magnitude of negative equity."], "trap": "Subtracting a negative means **adding**."}, {"lecture": "Lecture 05 - Introduction to Finance Accounting", "lectureNo": 5, "sourceQ": 14, "type": "Single Choice", "question": "Startup data: customers 80,000; salaries & expenses 50,000; equipment purchase 20,000; bank loan 30,000; loan repayment 10,000. Net Cash Flow from **Operating** Activities:", "options": {"A": "20,000", "B": "30,000", "C": "50,000", "D": "80,000"}, "correct": ["B"], "hint": "Classify first. Only use the Operating inflows and outflows.", "explanation": "Operating Cash Flow = Customer receipts − Salaries/expenses  \n= 80,000 − 50,000  \n= **LKR 30,000**", "wrong": ["A. Incorrectly includes the equipment purchase.", "C. Is the Operating outflow alone.", "D. Is the Operating inflow alone."], "trap": "The question asks for **Operating only**."}, {"lecture": "Lecture 05 - Introduction to Finance Accounting", "lectureNo": 5, "sourceQ": 15, "type": "Single Choice", "question": "Same data. Net Increase in Cash across all activities:", "options": {"A": "+20,000", "B": "+30,000", "C": "+50,000", "D": "+80,000"}, "correct": ["B"], "hint": "Combine Operating, Investing, and Financing net cash flows.", "explanation": "Operating = 80,000 − 50,000 = **+30,000**  \nInvesting = **−20,000**  \nFinancing = 30,000 − 10,000 = **+20,000**  \nNet Increase = 30,000 − 20,000 + 20,000 = **+LKR 30,000**", "wrong": ["A. Does not include all three categories correctly.", "C. Omits some outflows.", "D. Uses the customer inflow only."], "trap": "Operating net and total net both equal 30,000 here **by coincidence**."}, {"lecture": "Lecture 05 - Introduction to Finance Accounting", "lectureNo": 5, "sourceQ": 16, "type": "Single Choice", "question": "Dialog Axiata: Revenue 180, Gross Profit 90. Gross Profit Margin is:", "options": {"A": "11%", "B": "50%", "C": "90%", "D": "2:1"}, "correct": ["B"], "hint": "Use **Gross Profit / Revenue × 100**.", "explanation": "Gross Profit Margin = 90 / 180 × 100 = **50%**", "wrong": ["A. The lecture example lists approximately 11% as Net Profit Margin.", "C. 90 is the Gross Profit amount, not the margin percentage.", "D. 2:1 is the Current Ratio in the lecture example."], "trap": "Profitability ratios are generally **percentages**; Current Ratio is expressed as a ratio."}, {"lecture": "Lecture 05 - Introduction to Finance Accounting", "lectureNo": 5, "sourceQ": 17, "type": "Multiple Answer", "question": "Which are **current assets**? (Select all that apply.)", "options": {"A": "Cash on hand", "B": "Accounts receivable", "C": "Inventory", "D": "Machinery", "E": "Goodwill"}, "correct": ["A", "B", "C"], "hint": "Choose assets that are cash or can generally be converted to cash within **one year**.", "explanation": "The lecture lists cash on hand, accounts receivable, and inventory as **current assets**.", "wrong": ["D. Machinery is a fixed asset.", "E. Goodwill is an intangible asset."], "trap": "⚠ **Over-selection warning:** machinery and goodwill are assets, but they are not **current** assets."}, {"lecture": "Lecture 05 - Introduction to Finance Accounting", "lectureNo": 5, "sourceQ": 18, "type": "Multiple Answer", "question": "Which are Investing Activities? (Select all that apply.)", "options": {"A": "Purchase of servers", "B": "Selling old equipment", "C": "Dividends paid to shareholders", "D": "Investment in new technologies", "E": "Payment of salaries"}, "correct": ["A", "B", "D"], "hint": "Investing activities mainly involve long-term assets and investments.", "explanation": "Purchasing servers, selling old equipment, and investing in new technologies are Investing Activities.", "wrong": ["C. Dividends paid to shareholders are Financing Activities.", "E. Salaries are Operating Activities."], "trap": "⚠ **Over-selection warning:** the word **investment** alone does not decide the category; shareholder financing is still Financing."}, {"lecture": "Lecture 05 - Introduction to Finance Accounting", "lectureNo": 5, "sourceQ": 19, "type": "Multiple Answer", "question": "Which statements about the **three key financial statements** are correct? (Select all that apply.)", "options": {"A": "Balance Sheet shows financial position at a specific point in time", "B": "Income Statement shows revenues and expenses over a period", "C": "Cash Flow Statement shows movement of cash in and out of the business", "D": "Income Statement primarily lists assets, liabilities, and equity", "E": "Cash Flow Statement helps assess the business's ability to generate and manage cash"}, "correct": ["A", "B", "C", "E"], "hint": "Match each statement to its main purpose: **position, performance, cash movement**.", "explanation": "The lecture defines the Balance Sheet as showing **position**, the Income Statement as showing **performance**, and the Cash Flow Statement as showing **cash movement and cash-management ability**.", "wrong": ["D. Assets, liabilities, and equity belong primarily to the Balance Sheet."], "trap": "⚠ **Over-selection warning:** do not mix Balance Sheet contents with Income Statement contents."}, {"lecture": "Lecture 05 - Introduction to Finance Accounting", "lectureNo": 5, "sourceQ": 20, "type": "Multiple Answer", "question": "Which are financial-ratio categories used in the lecture to analyze business health? (Select all that apply.)", "options": {"A": "Profitability ratios", "B": "Liquidity ratios", "C": "Efficiency ratios", "D": "Gearing ratios", "E": "Marketing ratios"}, "correct": ["A", "B", "C", "D"], "hint": "Think about **profit, short-term paying ability, resource use, and financing risk**.", "explanation": "The lecture identifies **profitability, liquidity, efficiency (activity), and gearing** ratios as categories used to analyze business health.", "wrong": ["E. Marketing ratios are not one of the financial-ratio categories listed in this lecture."], "trap": "⚠ **Over-selection warning:** select only the categories explicitly used in Lecture 05."}, {"lecture": "Lecture 07 - Legal and Ethical Issues in IT Business", "lectureNo": 7, "sourceQ": 1, "type": "Single Choice", "question": "Which IP type protects software code?", "options": {"A": "Patent", "B": "Copyright", "C": "Trademark", "D": "Trade Secret"}, "correct": ["B"], "hint": n e-contract is best defined as an agreement that is:", "options": {"A": "Signed on paper then scanned", "B": "Created, accepted, and stored electronically", "C": "Verbally agreed and emailed", "D": "Automatically legally binding worldwide"}, "correct": ["B"], "hint": "The definition includes three electronic stages.", "explanation": "An e-contract is an agreement created, accepted, and stored electronically.", "wrong": ["A. A scanned paper contract is not the lecture’s definition of an e-contract.", "C. This does not capture the complete electronic creation and acceptance process.", "D. E-contracts can have legal recognition under applicable laws; they are not automatically binding worldwide."], "trap": "Watch absolute claims such as **automatically** and **worldwide**."}, {"lecture": "Lecture 07 - Legal and Ethical Issues in IT Business", "lectureNo": 7, "sourceQ": 7, "type": "Single Choice", "question": "Which is NOT one of the five ethical issues for IT professionals in this lecture?", "options": {"A": "Access Right", "B": "Trade Secrets", "C": "Regulatory Compliance", "D": "AI & Automation"}, "correct": ["C"], "hint": "Separate the lecture’s **legal issues** list from its **ethical issues** list.", "explanation": "Regulatory Compliance is listed under legal issues. The ethical issues include Personal Privacy, Access Right, Harmful Actions, Trade Secrets, and AI & Automation.", "wrong": ["A. Access Right is an ethical issue.", "B. Trade Secrets is an ethical issue in the lecture’s ethical list.", "D. AI & Automation is an ethical issue."], "trap": "Memorize the separation: **6 legal areas vs 5 ethical areas**."}, {"lecture": "Lecture 07 - Legal and Ethical Issues in IT Business", "lectureNo": 7, "sourceQ": 8, "type": "Single Choice", "question": "The Amazon AI recruitment case primarily illustrates:", "options": {"A": "Breach notification failure", "B": "Bias learned from historical hiring data", "C": "Software piracy", "D": "Lack of e-signature security"}, "cor are, and conducting software audits. Publicly releasing source code was not one of them.", "wrong": ["A. Paying a $100,000 settlement was an outcome.", "B. Stopping the use of unlicensed software was required.", "C. Conducting software audits was required."], "trap": "Memorize **$100,000** together with **stop unlicensed use + audits**."}, {"lecture": "Lecture 07 - Legal and Ethical Issues in IT Business", "lectureNo": 7, "sourceQ": 11, "type": "Single Choice", "question": "Which CSSL value covers avoiding plagiarism and giving proper credit?", "options": {"A": "Professionalism", "B": "Honesty", "C": "Competence", "D": "Responsibility and Integrity"}, "correct": ["B"], "hint": "Which value is most directly connected to truthfulness and avoiding deception?", "explanation": "Honesty includes truthfulness, avoiding plagiarism or deception, and giving proper credit.", "wrong": ["A. Professionalism concerns standards, dignity, and the reputation of the profession.", "C. Competence concerns accepting suitable work, improving knowledge, and delivering quality.", "D. Responsibility and Integrity includes confidentiality, conflicts of interest, and acting in stakeholders’ best interests."], "trap": "Plagiarism may feel like professionalism, but the lecture maps it to **Honesty**."}, {"lecture": "Lecture 07 - Legal and Ethical Issues in IT Business", "lectureNo": 7, "sourceQ": 12, "type": "Single Choice", "question": "Accepting only work you are qualified to perform belongs to which CSSL value?", "options": {"A": "Competence", "B": "Professional Development", "C": "Adding Value to Sri Lanka", "D": "Professionalism"}, "correct": ["A"], "hint": "Think about your **current ability and qualifications**, not future learning.", "explanation": "Competence means accepting work you are qualified to perform, improving knowledge, and delivering quality work.", "wrong": ["B. Professional Development focuses on lifelong learning and knowledge sharing.", "C. Adding Value to Sri Lanka conce const S={qs:[],a:{},h:0};
const $=s=>document.querySelector(s);
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function fmt(s=''){return esc(s).replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>')}
function sh(a){a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function lecs(){let m=new Map;BANK.forEach(q=>m.set(q.lectureNo,q.lecture));return [...m.entries()].sort((a,b)=>a[0]-b[0])}
function init(){ $('#lec').innerHTML=lecs().map(([n,x])=>`<option value="${n}">${esc(x)}</option>`).join(''); $('#lec').disabled=true; start() }
function start(){let mode=$('#mode').value,n=Number($('#lec').value||1); if(mode==='all'){S.qs=[...BANK];$('#paperTitle').textContent='Complete Question Bank';$('#paperDesc').textContent='All 120 questions'}else if(mode==='lecture'){S.qs=BANK.filter(q=>q.lectureNo===n);$('#paperTitle').textContent=S.qs[0].lecture;$('#paperDesc').textContent='20-question lecture practice'}else{let a=[];for(const [x] of lecs())a.push(...sh(BANK.filter(q=>q.lectureNo===x)).slice(0,5));S.qs=sh(a);$('#paperTitle').textContent='Mixed Midterm Paper';$('#paperDesc').textContent='30 questions · 5 random questions from each lecture'}S.a={};S.h=0;render();window.scrollTo({top:0,behavior:'smooth'})}
function reset(){S.a={};S.h=0;render();window.scrollTo({top:0,behavior:'smooth'})}
function multiScore(q,s){let c=new Set(q.correct),good=0,bad=0;s.forEach(x=>c.has(x)?good++:bad++);return Math.max(0,Math.min(1,(good-bad)/c.size))}
function exact(q,s){return [...s].sort().join(',')===[...q.correct].sort().join(',')}
function full(q,l){return `${l}. ${q.options[l]||''}`}
function render(){ $('#quiz').innerHTML=S.qs.map((q,i)=>{let a=S.a[i],sel=a?.selected||[],lock=!!a?.locked,multi=q.type.toLowerCase().startsWith('multiple');let os=Object.entries(q.options).map(([l,t])=>{let cl='option';if(sel.includes(l))cl+=' selected';if(lock){cl+=' locked';if(q.correct.includes(l))cl+=' correct';if(sel.includes(l)&&!q.correct.includes(l))cl+=' wrong'}return `<div class="${cl}" data-i="${i}" data-l="${l}" data-m="${multi}">${multi?`<input type="checkbox" ${sel.includes(l)?'checked':''} ${lock?'disabled':''}>`:''}<span class="letter">${l}</span><span>${fmt(t)}</span></div>`}).join('');let r='';if(lock)r=a.score===1?`<div class="result good">✓ Correct <button class="secondary tiny" data-e="${i}">View explanation</button></div>`:a.score>0?`<div class="result partial">◐ Partial credit ${(a.score*100).toFixed(0)}% <button class="secondary tiny" data-e="${i}">View explanation</button></div>`:`<div class="result bad">✕ Incorrect <button class="secondary tiny" data-e="${i}">View explanation</button></div>`;return `<article class="card" id="q${i}"><div class="top"><div><div class="lecture">${esc(q.lecture)}</div><div class="qrow"><div class="qnum">${i+1}</div><div class="qtext">${fmt(q.question)}</div></div><div class="note">${multi?'<span class="warn">Multiple Answer · ⚠ Wrong extra selections reduce marks</span>':'Single Choice'} · Source Q${q.sourceQ}</div></div><button class="hint" data-h="${i}">💡 Hint</button></div><div class="options">${os}</div>${multi&&!lock?`<div class="multirow"><button class="primary" data-s="${i}">Submit Answer</button><span class="note">Select all that apply.</span></div>`:''}${r}</article>`}).join('');bind();stats()}
function bind(){document.querySelectorAll('.option').forEach(el=>el.onclick=()=>{let i=+el.dataset.i,l=el.dataset.l,m=el.dataset.m==='true',q=S.qs[i];if(S.a[i]?.locked)return;if(m){let s=S.a[i]?.selected?[...S.a[i].selected]:[];let p=s.indexOf(l);p>=0?s.splice(p,1):s.push(l);S.a[i]={selected:s,locked:false,score:0};render();setTimeout(()=>document.getElementById('q'+i)?.scrollIntoView({block:'center'}),0)}else{let sc=q.correct.includes(l)?1:0;S.a[i]={selected:[l],locked:true,score:sc};render();if(!sc)explain(i,true)}});document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{let i=+b.dataset.s,q=S.qs[i],s=S.a[i]?.selected||[];if(!s.length)return modal('Select an answer','<div class="box hintbox">Choose at least one option first.</div>');let sc=multiScore(q,s);S.a[i]={selected:s,locked:true,score:sc};render();if(!exact(q,s))explain(i,true)});document.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{let i=+b.dataset.h;S.h++;stats();modal('💡 Hint',`<div class="box hintbox">${fmt(S.qs[i].hint)}</div><p style="font-size:.8rem;color:#6c7991">The hint does not reveal the answer.</p>`)});document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>explain(+b.dataset.e,false))}
function explain(i,popup){let q=S.qs[i],a=S.a[i],s=a?.selected||[],y=s.length?s.map(l=>full(q,l)).join('<br>'):'No answer',c=q.correct.map(l=>full(q,l)).join('<br>'),w=q.wrong.length?`<ul>${q.wrong.map(x=>`<li>${fmt(x)}</li>`).join('')}</ul>`:'<p>No distractor explanation required.</p>';modal(popup?(a.score>0?'◐ Partial Answer — Review':'✕ Incorrect — Review'):'Answer Explanation',`${popup?`<div class="box redbox"><strong>Your answer:</strong><br>${y}</div>`:''}<div class="box greenbox"><strong>Correct answer${q.correct.length>1?'s':''}:</strong><br>${c}</div><h4>Explanation</h4><p>${fmt(q.explanation)}</p><h4>Why other answers are wrong</h4>${w}<div class="box trapbox"><strong>⚫ Trap</strong><br>${fmt(q.trap)}</div>`)}
function stats(){let total=S.qs.length,v=Object.values(S.a).filter(a=>a.locked),sum=v.reduce((x,a)=>x+(a.score||0),0);$('#answered').textContent=`${v.length} / ${total}`;$('#score').textContent=(total?sum/total*100:0).toFixed(1)+'%';$('#hints').textContent=S.h;$('#fill').style.width=(total?v.length/total*100:0)+'%'}
function finish(){let total=S.qs.length,v=Object.values(S.a).filter(a=>a.locked),sum=v.reduce((x,a)=>x+(a.score||0),0),pct=total?sum/total*100:0,full=v.filter(a=>a.score===1).length,part=v.filter(a=>a.score>0&&a.score<1).length,wrong=v.filter(a=>a.score===0).length;modal('Paper Summary',`<div class="grid"><div class="cell"><b>${pct.toFixed(1)}%</b><span>Score</span></div><div class="cell"><b>${full}</b><span>Full correct</span></div><div class="cell"><b>${part}</b><span>Partial</span></div><div class="cell"><b>${wrong}</b><span>Wrong</span></div></div><p><strong>Answered:</strong> ${v.length}/${total} · <strong>Unanswered:</strong> ${total-v.length} · <strong>Hints:</strong> ${S.h}</p><div class="box hintbox">Multi-select: correct ticks earn credit; wrong extra ticks deduct credit. Minimum score per question is zero.</div>`)}
function modal(t,b){$('#mtitle').innerHTML=t;$('#mbody').innerHTML=b;$('#overlay').classList.add('show');document.body.style.overflow='hidden'}
function closeM(){$('#overlay').classList.remove('show');document.body.style.overflow=''}
$('#x').onclick=$('#ok').onclick=closeM;$('#overlay').onclick=e=>{if(e.target.id==='overlay')closeM()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});$('#mode').onchange=()=>{$('#lec').disabled=$('#mode').value!=='lecture';start()};$('#lec').onchange=start;$('#start').onclick=start;$('#reset').onclick=reset;$('#finish1').onclick=$('#finish2').onclick=finish;$('#newpaper').onclick=start;init();
</script></body></html>
